name: iOS Signed Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check Xcode and SDK versions
        run: |
          XCODE_VERSION=$(xcodebuild -version | awk '/Xcode/ {print $2}')
          XCODE_MAJOR=$(echo $XCODE_VERSION | cut -d'.' -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode version must be 26 or higher"
            exit 1
          fi

          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_MAJOR=$(echo $SDK_VERSION | cut -d'.' -f1)
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "iphoneos SDK version must be 26 or higher"
            exit 1
          fi

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm run ios:sync

      - name: Create temp keychain
        run: |
          security create-keychain -p "temp-password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp-password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Import Certificate and Profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Import certificate
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-password" build.keychain

          # Decode profile
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          # Extract info
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          NAME=$(security cms -D -i profile.mobileprovision | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i profile.mobileprovision | plutil -extract TeamIdentifier.0 raw -)
          APP_ID=$(security cms -D -i profile.mobileprovision | plutil -extract application-identifier raw -)

          if [ "$TEAM_ID" != "BKXSXM4KM4" ]; then
            echo "Invalid TeamIdentifier: $TEAM_ID"
            exit 1
          fi

          if [[ "$APP_ID" != *".com.platecraft.app" ]]; then
            echo "Invalid application-identifier: $APP_ID"
            exit 1
          fi

          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/"$UUID".mobileprovision
          
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> $GITHUB_ENV

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning build.keychain

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Platecraft.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROVISIONING_PROFILE_NAME }}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.platecraft.app

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.platecraft.app</key>
              <string>${{ env.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Platecraft.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Verify IPA and Signature
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            exit 1
          fi

          if [ ! -s "$IPA_PATH" ]; then
            echo "IPA file is empty"
            exit 1
          fi

          echo "IPA exists: $IPA_PATH"

          mkdir -p temp_unzip
          unzip -q "$IPA_PATH" -d temp_unzip
          APP_PATH=$(find temp_unzip/Payload -name "*.app" | head -1)

          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Authority|Format)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: platecraft-signed-release
          path: build/export/*.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 profile.mobileprovision ExportOptions.plist || true
          rm -rf temp_unzip || true
